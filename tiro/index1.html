<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="css/style.css" rel="stylesheet">
  </head>
  <body>
 	<main class="container text-center p-3 border rounded" >
		<h1>Ma Todo List</h1>
		<form class="input-group mb-3" id="todoForm">

			  <div class="col-auto">
				<label for="inputPassword2" class="visually-hidden">Password</label>
				<input type="password" class="form-control" id="inputPassword2" placeholder="Password">
				</div>
				<div class="col-auto">
					<button type="submit" class="btn btn-primary mb-3">Confirm identity</button>
				</div>

		</form>

		<p id="msg"></p>
		<ul id="todoList">
		</ul>

		<div class="footer">
			<p>
				<span id="count">0</span> tâche(s) restante(s)
			</p>

			<div class="filter">

				<button class="filter active" data-filter="all">Toutes</button>
		 		<button class="filter" data-filter="do">A faire</button>
				<button class="filter" data-filter="done">Terminées</button>

			</div>
		</div>
	</main> 
  </body>
</html>
