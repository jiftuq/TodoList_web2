<!DOCTYPE html>
<html lang="fr">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Ma Todo List</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
	<main class="container py-5">
		<div class="row justify-content-center">
			<div class="col-12 col-md-8 col-lg-6">
				<div class="card shadow-sm">
					<div class="card-body p-4">

						<h1 class="h3 text-center mb-4">Ma Todo List</h1>

						<form id="todoForm" class="mb-2">
							<div class="input-group">
								<input type="text" id="todoInput" class="form-control" placeholder="Ajouter une tâche"
									autocomplete="off">
								<button type="submit" class="btn btn-primary">Ajouter</button>
							</div>
						</form>

						<p id="message" class="small mb-3"></p>

						<ul id="todoList" class="list-group mb-3"></ul>

						<div class="footer d-flex justify-content-between align-items-center mb-3">
							<p class="text-muted small mb-0">
								<span id="count">0</span> tâche(s) restante(s)
							</p>

						</div>

						<div class="filter btn-group w-100" role="group">
							<button type="button" class="btn btn-outline-secondary active"
								data-filter="all">Toutes</button>
							<button type="button" class="btn btn-outline-secondary" data-filter="todo">À faire</button>
							<button type="button" class="btn btn-outline-secondary"
								data-filter="done">Terminées</button>
						</div>

					</div>
				</div>
			</div>
		</div>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
