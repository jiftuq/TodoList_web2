<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <link href="css/style.css" rel="stylesheet">
  </head>
  <body>
 	<main class="container">
		<h1>Ma Todo List</h1>
		<form id="todoForm">

			<input id="todoInput" type="texte" name="texte" placeholder="Ajouter une tache" autocomplete="off">
			<button type="submit">Ajouter</button>

		</form>

		<p id="msg"></p>
		<ul id="todoList">
		</ul>

		<div class="footer">
			<p>
				<span id="count">0</span> tâche(s) restante(s)
			</p>

			<div class="filter">

				<button class="filter active" data-filter="all">Toutes</button>
		 		<button class="filter" data-filter="do">A faire</button>
				<button class="filter" data-filter="done">Terminées</button>

			</div>
		</div>
	</main> 
  </body>
</html>
